name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
  # Validate packaging when this workflow changes, without publishing a release.
  push:
    branches: [master]
    paths:
      - .github/workflows/release.yml
      - scripts/package_release.py
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package_release.py

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      # On release events, github.sha is the commit referenced by the release tag.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Test
        run: cargo +stable test --locked --target ${{ matrix.target }}
      - name: Build optimized executable
        run: cargo +stable build --locked --release --target ${{ matrix.target }}
      - name: Package executable and licenses
        run: python scripts/package_release.py ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach executables to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
